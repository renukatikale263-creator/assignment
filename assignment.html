<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assignment Review & Resubmission Portal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; padding: 20px; }
    .container { max-width: 1000px; margin: 0 auto; }
    header { background-color: #1e293b; color: #fff; padding: 20px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    header h1 { font-size: 1.4rem; }
    .btn-logout { background-color: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .btn-logout:hover { background-color: #dc2626; }
    .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
    .card h2 { margin-bottom: 15px; color: #1e293b; border-bottom: 2px solid #f1f5f9; padding-bottom: 8px; }
    
    /* Tabs & Buttons */
    .tab-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .tab-btn { flex: 1; padding: 10px; background: #e2e8f0; border: none; cursor: pointer; font-weight: bold; border-radius: 4px; color: #475569; }
    .tab-btn.active { background: #2563eb; color: white; }
    .btn-primary { background-color: #2563eb; color: white; padding: 10px 18px; border: none; border-radius: 4px; font-size: 0.95rem; cursor: pointer; font-weight: bold; }
    .btn-primary:hover { background-color: #1d4ed8; }
    .btn-demo { background-color: #64748b; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; }

    /* Forms */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 0.95rem; }
    .form-row { display: flex; gap: 15px; }
    .form-row .form-group { flex: 1; }

    /* Status Badges */
    .badge { padding: 4px 10px; border-radius: 12px; font-size: 0.85rem; font-weight: bold; display: inline-block; }
    .badge-accepted { background-color: #dcfce7; color: #15803d; }
    .badge-changes { background-color: #fef3c7; color: #b45309; }
    .badge-pending { background-color: #e0f2fe; color: #0369a1; }

    /* Lists & History Timeline */
    .submission-item { border: 1px solid #e2e8f0; border-radius: 6px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
    .history-card { background: #ffffff; border-left: 4px solid #2563eb; padding: 12px; margin-top: 10px; border-radius: 0 6px 6px 0; }
    .history-header { display: flex; justify-content: space-between; margin-bottom: 6px; font-weight: bold; font-size: 0.9rem; color: #334155; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Assignment Review & Resubmission Portal</h1>
      <div id="user-info" class="hidden">
        <span id="welcome-text" style="margin-right: 15px;"></span>
        <button class="btn-logout" onclick="logout()">Logout</button>
      </div>
    </header>

    <!-- AUTHENTICATION MODULE -->
    <div id="auth-section">
      <div class="card" style="max-width: 500px; margin: 0 auto;">
        <div class="tab-group">
          <button class="tab-btn active" onclick="switchAuthTab('login')">Login</button>
          <button class="tab-btn" onclick="switchAuthTab('register')">Register</button>
        </div>

        <!-- Quick Demo Login Buttons -->
        <div style="margin-bottom: 15px; background: #f8fafc; padding: 10px; border-radius: 4px; border: 1px solid #e2e8f0;">
          <small style="display:block; margin-bottom:5px; font-weight:bold; color:#64748b;">Quick Demo Logins:</small>
          <button class="btn-demo" onclick="demoLogin('professor')">Log in as Professor</button>
          <button class="btn-demo" onclick="demoLogin('student')">Log in as Student</button>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
          <h2>Login</h2>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="login-email" required placeholder="Enter email">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="login-password" required placeholder="Enter password">
          </div>
          <button type="submit" class="btn-primary" style="width: 100%;">Login</button>
        </form>

        <form id="register-form" class="hidden" onsubmit="handleRegister(event)">
          <h2>Register</h2>
          <div class="form-group">
            <label>Full Name</label>
            <input type="text" id="reg-name" required placeholder="e.g. John Doe">
          </div>
          <div class="form-group">
            <label>Email</label>
            <input type="email" id="reg-email" required placeholder="e.g. user@college.edu">
          </div>
          <div class="form-group">
            <label>Password</label>
            <input type="password" id="reg-password" required placeholder="Create password">
          </div>
          <div class="form-group">
            <label>Role</label>
            <select id="reg-role">
              <option value="student">Student</option>
              <option value="admin">Admin / Professor</option>
            </select>
          </div>
          <button type="submit" class="btn-primary" style="width: 100%;">Register</button>
        </form>
      </div>
    </div>

    <!-- PROFESSOR / ADMIN REVIEW DASHBOARD -->
    <div id="admin-dashboard" class="hidden">
      <div class="card">
        <h2>Professor Review Dashboard</h2>
        <div id="admin-submissions-list"></div>
      </div>
    </div>

    <!-- STUDENT DASHBOARD -->
    <div id="student-dashboard" class="hidden">
      <!-- Create or Update Submission -->
      <div class="card">
        <h2 id="submission-form-title">Submit Assignment</h2>
        <div id="resubmit-warning" class="hidden" style="background:#fee2e2; color:#991b1b; padding:10px; border-radius:4px; margin-bottom:15px; font-weight:bold;">
          ✓ Your submission has been Accepted! Further updates are locked.
        </div>
        <form id="submission-form" onsubmit="handleStudentSubmit(event)">
          <div class="form-group">
            <label>Assignment Title</label>
            <input type="text" id="assign-title" required placeholder="e.g., Data Structures Homework 1">
          </div>
          <div class="form-group">
            <label>Submission Link or Content</label>
            <textarea id="assign-content" rows="4" required placeholder="Paste repository link or write your submission content here..."></textarea>
          </div>
          <div class="form-group">
            <label>Notes / Revision Summary</label>
            <input type="text" id="assign-notes" placeholder="e.g., Initial submission or Fixed bugs pointed out in review">
          </div>
          <button type="submit" id="submit-btn" class="btn-primary">Submit Version</button>
        </form>
      </div>

      <!-- Submission History View -->
      <div class="card">
        <h2>My Submission History</h2>
        <div id="student-history-list"></div>
      </div>
    </div>
  </div>

  <script>
    // Initial Data Pre-population
    const defaultUsers = [
      { id: '1', name: 'Dr. Alan Turing', email: 'prof@college.edu', password: '123', role: 'admin' },
      { id: '2', name: 'Alice Smith', email: 'student@college.edu', password: '123', role: 'student' }
    ];

    const defaultSubmissions = [
      {
        id: 'sub-101',
        studentId: '2',
        studentName: 'Alice Smith',
        title: 'Operating Systems Lab 1',
        currentStatus: 'Needs Changes', // Accepted | Needs Changes | Pending
        currentMark: '65/100',
        currentFeedback: 'Good effort, but concurrency issues exist in thread allocation. Please fix and resubmit.',
        versions: [
          {
            version: 1,
            content: 'https://github.com/alice/os-lab1-v1',
            notes: 'First draft submission',
            timestamp: new Date(Date.now() - 86400000 * 2).toLocaleString(),
            feedback: 'Good effort, but concurrency issues exist in thread allocation. Please fix and resubmit.',
            mark: '65/100',
            status: 'Needs Changes'
          }
        ]
      }
    ];

    // Persistence Layer
    let users = JSON.parse(localStorage.getItem('portal_rev_users')) || defaultUsers;
    let submissions = JSON.parse(localStorage.getItem('portal_rev_submissions')) || defaultSubmissions;
    let currentUser = JSON.parse(localStorage.getItem('portal_rev_currentuser')) || null;

    function saveData() {
      localStorage.setItem('portal_rev_users', JSON.stringify(users));
      localStorage.setItem('portal_rev_submissions', JSON.stringify(submissions));
      localStorage.setItem('portal_rev_currentuser', JSON.stringify(currentUser));
    }

    // Navigation & Auth Logic
    function switchAuthTab(tab) {
      document.getElementById('login-form').classList.toggle('hidden', tab !== 'login');
      document.getElementById('register-form').classList.toggle('hidden', tab !== 'register');
      const tabs = document.querySelectorAll('.tab-btn');
      tabs[0].classList.toggle('active', tab === 'login');
      tabs[1].classList.toggle('active', tab === 'register');
    }

    function demoLogin(role) {
      currentUser = role === 'professor' ? users[0] : users[1];
      saveData();
      renderApp();
    }

    function handleRegister(e) {
      e.preventDefault();
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const password = document.getElementById('reg-password').value;
      const role = document.getElementById('reg-role').value;

      if (users.find(u => u.email === email)) return alert('Email already registered');

      const newUser = { id: Date.now().toString(), name, email, password, role };
      users.push(newUser);
      currentUser = newUser;
      saveData();
      renderApp();
    }

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value.trim();
      const password = document.getElementById('login-password').value;
      const user = users.find(u => u.email === email && u.password === password);

      if (!user) return alert('Invalid credentials');
      currentUser = user;
      saveData();
      renderApp();
    }

    function logout() {
      currentUser = null;
      localStorage.removeItem('portal_rev_currentuser');
      renderApp();
    }

    // Student Logic: Submit new version
    function handleStudentSubmit(e) {
      e.preventDefault();
      const title = document.getElementById('assign-title').value.trim();
      const content = document.getElementById('assign-content').value.trim();
      const notes = document.getElementById('assign-notes').value.trim();

      let sub = submissions.find(s => s.studentId === currentUser.id && s.title.toLowerCase() === title.toLowerCase());

      if (sub && sub.currentStatus === 'Accepted') {
        alert('Resubmission blocked: Your work has already been Accepted.');
        return;
      }

      if (sub) {
        // Create new version for existing submission
        const newVerNumber = sub.versions.length + 1;
        const newVersion = {
          version: newVerNumber,
          content,
          notes: notes || `Version ${newVerNumber} resubmission`,
          timestamp: new Date().toLocaleString(),
          feedback: 'Awaiting Professor Review',
          mark: 'Pending',
          status: 'Pending'
        };
        sub.versions.unshift(newVersion); // Latest version first
        sub.currentStatus = 'Pending';
        sub.currentFeedback = 'Awaiting Professor Review';
        sub.currentMark = 'Pending';
      } else {
        // Create brand new submission entry
        sub = {
          id: 'sub-' + Date.now(),
          studentId: currentUser.id,
          studentName: currentUser.name,
          title,
          currentStatus: 'Pending',
          currentMark: 'Pending',
          currentFeedback: 'Awaiting Professor Review',
          versions: [
            {
              version: 1,
              content,
              notes: notes || 'Initial Version',
              timestamp: new Date().toLocaleString(),
              feedback: 'Awaiting Professor Review',
              mark: 'Pending',
              status: 'Pending'
            }
          ]
        };
        submissions.push(sub);
      }

      saveData();
      document.getElementById('submission-form').reset();
      renderApp();
      alert('Assignment version submitted successfully!');
    }

    // Admin Logic: Grade & Feedback
    function handleReviewSubmit(e, subId) {
      e.preventDefault();
      const form = e.target;
      const status = form.querySelector('.review-status').value;
      const mark = form.querySelector('.review-mark').value.trim();
      const feedback = form.querySelector('.review-feedback').value.trim();

      const sub = submissions.find(s => s.id === subId);
      if (sub) {
        sub.currentStatus = status;
        sub.currentMark = mark || 'N/A';
        sub.currentFeedback = feedback;

        // Apply feedback to current active version (latest)
        if (sub.versions.length > 0) {
          sub.versions[0].status = status;
          sub.versions[0].mark = mark || 'N/A';
          sub.versions[0].feedback = feedback;
        }

        saveData();
        renderApp();
        alert('Review saved successfully!');
      }
    }

    // Rendering Helper Views
    function getStatusBadge(status) {
      if (status === 'Accepted') return `<span class="badge badge-accepted">Accepted</span>`;
      if (status === 'Needs Changes') return `<span class="badge badge-changes">Needs Changes</span>`;
      return `<span class="badge badge-pending">Pending Review</span>`;
    }

    function renderAdminDashboard() {
      const listContainer = document.getElementById('admin-submissions-list');
      listContainer.innerHTML = '';

      if (submissions.length === 0) {
        listContainer.innerHTML = '<p style="color:#64748b;">No student submissions found.</p>';
        return;
      }

      submissions.forEach(sub => {
        const item = document.createElement('div');
        item.className = 'submission-item';
        
        let historyHtml = sub.versions.map(v => `
          <div class="history-card">
            <div class="history-header">
              <span>Version ${v.version} - ${v.timestamp}</span>
              ${getStatusBadge(v.status)}
            </div>
            <p><strong>Content/Link:</strong> ${v.content}</p>
            <p><strong>Student Notes:</strong> ${v.notes}</p>
            <p style="margin-top:5px; color:#475569;"><strong>Review:</strong> Mark: ${v.mark} | Feedback: ${v.feedback}</p>
          </div>
        `).join('');

        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h3>${sub.title} <small style="font-weight:normal; color:#64748b;">by ${sub.studentName}</small></h3>
            <div>${getStatusBadge(sub.currentStatus)}</div>
          </div>
          
          <form onsubmit="handleReviewSubmit(event, '${sub.id}')" style="background:#f1f5f9; padding:15px; border-radius:6px; margin-bottom:15px;">
            <div class="form-row">
              <div class="form-group">
                <label>Status</label>
                <select class="review-status">
                  <option value="Accepted" ${sub.currentStatus === 'Accepted' ? 'selected' : ''}>Accepted</option>
                  <option value="Needs Changes" ${sub.currentStatus === 'Needs Changes' ? 'selected' : ''}>Needs Changes</option>
                  <option value="Pending" ${sub.currentStatus === 'Pending' ? 'selected' : ''}>Pending</option>
                </select>
              </div>
              <div class="form-group">
                <label>Mark / Score</label>
                <input type="text" class="review-mark" value="${sub.currentMark !== 'Pending' ? sub.currentMark : ''}" placeholder="e.g. 85/100 or A">
              </div>
            </div>
            <div class="form-group">
              <label>Written Feedback</label>
              <textarea class="review-feedback" rows="2" placeholder="Write feedback for the student..." required>${sub.currentFeedback !== 'Awaiting Professor Review' ? sub.currentFeedback : ''}</textarea>
            </div>
            <button type="submit" class="btn-primary">Save Review & Feedback</button>
          </form>

          <h4 style="color:#475569; margin-top:10px;">Submission History</h4>
          ${historyHtml}
        `;
        listContainer.appendChild(item);
      });
    }

    function renderStudentDashboard() {
      const historyContainer = document.getElementById('student-history-list');
      const formTitle = document.getElementById('submission-form-title');
      const submitBtn = document.getElementById('submit-btn');
      const warning = document.getElementById('resubmit-warning');
      
      historyContainer.innerHTML = '';

      const mySubmissions = submissions.filter(s => s.studentId === currentUser.id);

      // Check if current active submission is accepted
      const latestSub = mySubmissions[0];
      if (latestSub && latestSub.currentStatus === 'Accepted') {
        warning.classList.remove('hidden');
        submitBtn.disabled = true;
        submitBtn.style.opacity = '0.5';
        submitBtn.style.cursor = 'not-allowed';
      } else {
        warning.classList.add('hidden');
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
        submitBtn.style.cursor = 'pointer';
      }

      if (latestSub && latestSub.currentStatus === 'Needs Changes') {
        formTitle.textContent = `Submit Updated Version for: ${latestSub.title}`;
        document.getElementById('assign-title').value = latestSub.title;
      } else {
        formTitle.textContent = 'Submit Assignment';
      }

      if (mySubmissions.length === 0) {
        historyContainer.innerHTML = '<p style="color:#64748b;">No submissions yet. Use the form above to submit your assignment.</p>';
        return;
      }

      mySubmissions.forEach(sub => {
        const item = document.createElement('div');
        item.className = 'submission-item';

        let historyHtml = sub.versions.map(v => `
          <div class="history-card">
            <div class="history-header">
              <span>Version ${v.version} — Submitting Date: ${v.timestamp}</span>
              ${getStatusBadge(v.status)}
            </div>
            <p><strong>Submitted Link/Content:</strong> ${v.content}</p>
            <p><strong>My Revision Notes:</strong> ${v.notes}</p>
            <div style="margin-top:8px; padding:8px; background:#f8fafc; border-radius:4px;">
              <strong>Professor Marks:</strong> ${v.mark} <br>
              <strong>Professor Feedback:</strong> ${v.feedback}
            </div>
          </div>
        `).join('');

        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>${sub.title}</h3>
            <div>Current Status: ${getStatusBadge(sub.currentStatus)}</div>
          </div>
          <p style="margin: 8px 0;"><strong>Latest Marks:</strong> ${sub.currentMark}</p>
          <p style="margin-bottom: 12px;"><strong>Latest Feedback:</strong> ${sub.currentFeedback}</p>
          <h4 style="color:#475569; margin-top:10px
